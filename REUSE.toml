# Copyright and licence of the files that cannot say so in a comment of their
# own. Every other file carries a header; CONTRIBUTING.md has the details.
# "make lint-reuse" checks that nothing is left out (https://reuse.software).

version = 1

# Documentation. A header shown as an example in these files is not their own.
[[annotations]]
path = ["*.md", ".github/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 plasma-login-blur-slider contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JSON has no comments.
[[annotations]]
path = [".commitlintrc.json", ".releaserc.json", "package.json", ".claude/**"]
SPDX-FileCopyrightText = "2026 plasma-login-blur-slider contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Written by tools, or read by them exactly as they are: the npm lockfile, the
# version markers (scripts/version.sh) and the test fixtures.
[[annotations]]
path = ["package-lock.json", ".git-archive-version", "VERSION", "tests/integration/fixtures/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 plasma-login-blur-slider contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
